# The visual editor's contract for nav.blade.php.
# The page links come from resources/data/site.json (nav_links) and the
# Solutions menu from solution_links, so editing them here changes every page.
title: Header
description: The floating white pill — mark, Solutions menu, page links, sign in, and the carbon button
fields:
    brand:
        type: text
        label: Site name
        description: Sits beside the mark, and is what screen readers announce.
        default: "Tempo"
    solutionsLabel:
        type: text
        label: Menu label
        default: "Solutions"
    signInText:
        type: text
        label: Sign in text
        default: "Sign in"
    signInLink:
        type: url
        label: Sign in link
        default: "#"
    ctaText:
        type: text
        label: Button text
        default: "Get started"
    ctaLink:
        type: url
        label: Button link
        default: "#"
    current:
        type: text
        label: Current page path
        description: Set by each page — the matching link reads as current.
        default: "/"
    solutions:
        type: repeater
        label: Solutions menu
        add_button_label: "Add solution"
        item_label: text
        source: site.solution_links
        sub_fields:
            text:
                type: text
                label: Label
                default: "For a new audience"
            description:
                type: text
                label: One line
                default: "What they get out of it"
            url:
                type: url
                label: Link
                default: "/features"
    links:
        type: repeater
        label: Page links
        add_button_label: "Add link"
        item_label: text
        source: site.nav_links
        sub_fields:
            text:
                type: text
                label: Label
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
