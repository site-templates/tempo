# The visual editor's contract for layouts/main.blade.php.
title: Page layout
description: The document shell — page title, meta description, and which nav link reads as current
fields:
    title:
        type: text
        label: Page title
        description: Shown in the browser tab, before the site name.
        default: "Home"
    description:
        type: textarea
        label: Meta description
        description: The one-line summary search engines show.
        rows: 3
        default: ""
    current:
        type: text
        label: Current page path
        description: The nav link matching this path reads as current — for example /pricing.
        default: "/"
